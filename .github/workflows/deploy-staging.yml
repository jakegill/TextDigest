name: deploy staging

on:
    push:
        branches: [staging]

permissions:
    id-token: write # OIDC token exchange with both Google STS and AWS STS
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: staging

        concurrency:
            group: deploy-staging
            cancel-in-progress: false

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v3

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Authenticate to Google Cloud (WIF)
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_DEPLOY_SA }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Configure docker for Artifact Registry
              run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

            - name: Docker login to Artifact Registry
              # `gcloud auth configure-docker` only sets up the credential helper
              # (docker-credential-gcloud), which buildx in the docker-container
              # driver can't see — it's sandboxed away from the host PATH. Writing
              # a static token into ~/.docker/config.json via `docker login` works
              # for both the host docker and buildx, so cache pull/push and image
              # push both succeed.
              run: |
                  gcloud auth print-access-token \
                    | docker login -u oauth2accesstoken --password-stdin \
                      https://us-central1-docker.pkg.dev

            - name: Authenticate to AWS (OIDC — for SST state bucket)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Materialize SST platform types
              run: pnpm exec sst install --print-logs

            - name: Typecheck all packages
              run: pnpm exec turbo run typecheck

            - name: SST refresh
              run: |
                  if pnpm exec sst state export --stage staging >/dev/null 2>&1; then
                    pnpm exec sst refresh --stage staging --print-logs
                  fi

            - name: SST deploy
              run: pnpm exec sst deploy --stage staging --print-logs
