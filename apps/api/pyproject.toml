[project]
name = "td-api"
version = "0.0.0"
description = "text-digest-v2 backend (FastAPI on Cloud Run)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mineru[pipeline]>=3.1.15",
    "google-cloud-storage>=2.18.0",
    "google-auth>=2.35.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
