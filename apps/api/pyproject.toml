[project]
name = "td-api"
version = "0.0.0"
description = "text-digest-v2 backend (FastAPI on Cloud Run)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mineru[pipeline]>=3.1.15",
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-tasks>=2.16.0",
    "google-auth>=2.35.0",
    "google-genai>=1.0.0",
    "firebase-admin>=6.6.0",
    "pypdfium2>=4.30.0",
    "python-multipart>=0.0.20",
    "llama-index-core>=0.14.0",
    "rapidfuzz>=3.10",
    "playwright>=1.49.0",
    "playwright-stealth>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mineru = { git = "https://github.com/jakegill/MinerU.git", branch = "master" }

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
