substitutions:
    _AWS_ACCOUNT_ID: ""
    _AWS_ROLE_ARN: ""

options:
    logging: CLOUD_LOGGING_ONLY
    machineType: E2_HIGHCPU_8

steps:
    - id: deployer-image
      name: gcr.io/cloud-builders/docker
      waitFor: ["-"]
      args: ["build", "-t", "td-deployer", "-f", "ci/cloudbuild/Dockerfile", "ci/cloudbuild"]

    - id: aws-creds
      name: amazon/aws-cli
      entrypoint: bash
      waitFor: ["-"]
      env:
          - "_AWS_ACCOUNT_ID=$_AWS_ACCOUNT_ID"
          - "_AWS_ROLE_ARN=$_AWS_ROLE_ARN"
          - "_STAGE=$BRANCH_NAME"
      args: ["-c", "ci/cloudbuild/aws-creds.sh"]

    - id: sst-deploy
      name: td-deployer
      entrypoint: bash
      waitFor: ["aws-creds", "deployer-image"]
      args:
          - "-c"
          - |
              set -euo pipefail
              case "$BRANCH_NAME" in
                staging|prod) ;;
                *) echo "refusing to deploy from branch '$BRANCH_NAME' (expected staging|prod)" >&2; exit 1 ;;
              esac
              set -a
              . /workspace/.aws-creds.env
              set +a
              gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
              corepack enable
              pnpm install --frozen-lockfile
              pnpm exec sst install --print-logs
              pnpm exec sst deploy --stage "$BRANCH_NAME" --print-logs

timeout: 3600s
